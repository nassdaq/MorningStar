[workspace]
resolver = "3"
members = [
    "crates/morningstar",
    "crates/morningstar-core",
    "crates/morningstar-gpu",
    "crates/morningstar-runtime",
    "crates/morningstar-text",
    "crates/morningstar-layout",
    "crates/morningstar-ui",
    "crates/morningstar-android",
    "crates/morningstar-ios",
    "examples/hello-gpu",
    "examples/showcase",
    "examples/fundidesk",
    "examples/callready",
    "examples/atlas",
    "examples/barua-talk",
    "examples/services-check",
    "examples/docs-snippets",
    "tools/morningstar-devtools",
    "tools/morningstar-preview",
    "tools/morningstar-cli",
    "benchmarks/host",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
repository = "https://github.com/nassdaq/MorningStar"
license = "MIT OR Apache-2.0"
# Not published unless a crate says otherwise: the examples, the benchmark
# and the documentation's samples stay here. The framework's crates and its
# tools set `publish = true` and are released together (ADR 0045).
publish = false

[workspace.dependencies]
# Path for this repository, version for crates.io: `cargo publish` keeps
# the version and drops the path (ADR 0045). The framework's crates share
# one version and are released together; the exact requirement keeps an
# app's library and the Android host of the same release together.
# The public crate is `morningstar-framework` on crates.io (`morningstar`
# is another project's there); its library is still `morningstar`.
morningstar = { package = "morningstar-framework", path = "crates/morningstar", version = "=0.1.1" }
morningstar-core = { path = "crates/morningstar-core", version = "=0.1.1" }
morningstar-gpu = { path = "crates/morningstar-gpu", version = "=0.1.1" }
morningstar-runtime = { path = "crates/morningstar-runtime", version = "=0.1.1" }
morningstar-text = { path = "crates/morningstar-text", version = "=0.1.1" }
morningstar-layout = { path = "crates/morningstar-layout", version = "=0.1.1" }
morningstar-ui = { path = "crates/morningstar-ui", version = "=0.1.1" }
morningstar-android = { path = "crates/morningstar-android", version = "=0.1.1" }
morningstar-ios = { path = "crates/morningstar-ios", version = "=0.1.1" }
morningstar-devtools = { path = "tools/morningstar-devtools", version = "=0.1.1" }
morningstar-preview = { path = "tools/morningstar-preview", version = "=0.1.1" }

# Only the backends the two mobile targets (and the macOS dev host, for tests)
# need: Vulkan + GLES on Android, Metal on Apple platforms.
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "vulkan",
    "gles",
    "wgsl",
] }
pollster = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
