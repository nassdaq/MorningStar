<!-- An outline icon made of several element kinds: lines, circles, a
     polyline and a rounded rect, as the 24 px stroke sets mix them. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="18" height="18" rx="4"/>
  <line x1="7" y1="9" x2="17" y2="9"/>
  <circle cx="10" cy="9" r="2" fill="currentColor" stroke="none"/>
  <line x1="7" y1="15" x2="17" y2="15"/>
  <circle cx="14" cy="15" r="2" fill="currentColor" stroke="none"/>
  <polyline points="15 5.5 17 5.5 17 7"/>
</svg>
