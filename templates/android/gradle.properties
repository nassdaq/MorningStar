org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true

# Per-application settings. tools/build-android.sh takes them from the app's
# Cargo.toml ([package.metadata.morningstar], ADR 0020) and passes them; these
# are the values of the default example. Override on the command line, e.g.
#   ./gradlew assembleDebug -Pmorningstar.appId=com.example.app -Pmorningstar.libName=my_app
morningstar.appId=dev.morningstar.hello
morningstar.appName=Morningstar
# Name of the Rust cdylib without the "lib" prefix and ".so" suffix.
morningstar.libName=hello_gpu
# morningstar.resDir: the directory of generated launcher icons. Default:
# app/build/generated/morningstar/res, where tools/build-android.sh puts them.
