# XcodeGen spec for the Morningstar iOS host. Generate the Xcode project with
#   xcodegen generate --spec templates/ios/project.yml
# after tools/build-ios.sh has produced build/Morningstar.xcframework and
# build/generated (the app's icon, bundle id and names, from its Cargo.toml:
# ADR 0020). Generate again after building a different app.
name: MorningstarHost
options:
  # No bundleIdPrefix: it would set PRODUCT_BUNDLE_IDENTIFIER on the target,
  # over the app's own.
  deploymentTarget:
    iOS: "15.0"
targets:
  MorningstarHost:
    type: application
    platform: iOS
    sources:
      - Sources
      # NOT VERIFIED (no Xcode on the machine this was written on): the
      # generated asset catalog, holding AppIcon as one 1024x1024 opaque
      # PNG ("single size", Xcode 14 and later).
      - path: build/generated/Assets.xcassets
    # NOT VERIFIED: defines MORNINGSTAR_BUNDLE_ID, MORNINGSTAR_PRODUCT_NAME
    # and MORNINGSTAR_DISPLAY_NAME for the settings below. They are not
    # written here because this file is the same for every app.
    configFiles:
      Debug: build/generated/Morningstar.xcconfig
      Release: build/generated/Morningstar.xcconfig
    dependencies:
      # The Rust application, built as a static library for device + simulator.
      - framework: build/Morningstar.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      # Platform services (ADR 0019): recording and playback.
      - sdk: AVFoundation.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MORNINGSTAR_BUNDLE_ID)
        PRODUCT_NAME: $(MORNINGSTAR_PRODUCT_NAME)
        # The name under the icon.
        INFOPLIST_KEY_CFBundleDisplayName: $(MORNINGSTAR_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../crates/morningstar-ios/include
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Shown by iOS the first time the application starts a recording.
        # iOS terminates an app that touches the microphone without it.
        # Replace the wording with what the application records and why.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Records your voice when you ask it to."
    # NOT VERIFIED (no Xcode on the machine this was written on): the keys
    # below cannot be given as INFOPLIST_KEY_ build settings, so XcodeGen
    # writes them to Info.plist, which Xcode merges with the
    # generated keys above.
    #
    # App Transport Security: HTTPS only, except plain HTTP to "localhost",
    # for development against a server on the developer's machine (which is
    # what localhost means in the simulator). An exception domain cannot be
    # an IP address, so http://127.0.0.1 is refused: use the name.
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
