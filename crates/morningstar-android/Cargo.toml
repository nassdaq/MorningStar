[package]
name = "morningstar-android"
description = "Android host integration for Morningstar: JNI entry points and the render thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
keywords = ["gui", "android", "jni"]
categories = ["gui", "os::android-apis"]
# The tests read fonts from the examples, which are not published.
exclude = ["tests/"]

# No dependency on a JNI or NDK binding crate: the host needs four C functions,
# declared in `src/sys.rs`.
[dependencies]
morningstar-runtime.workspace = true
