<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, system-ui, sans-serif; color: #14201A; display: flex; flex-direction: column; padding: 56px 24px 32px">

<h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.4px">Set up your shop</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #5B6660">These details appear on customer receipts and the repair tracking page.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 18px; margin-top: 26px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ss-name" style="font-size: 13px; font-weight: 500">Shop name</label>
<input id="ss-name" type="text" placeholder="Enter the name of your shop" style="width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #D9E0DB; border-radius: 12px; padding: 0 16px; font: 400 15px Inter, system-ui, sans-serif; color: #14201A; background: #FFFFFF; outline-color: #1E8416">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<input id="ss-area" type="text" placeholder="Street or building, e.g. Kariakoo" style="width: 100%; height: 52px; box-sizing: border-box; border: 1px solid #D9E0DB; border-radius: 12px; padding: 0 16px; font: 400 15px Inter, system-ui, sans-serif; color: #14201A; background: #FFFFFF; outline-color: #1E8416">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span id="ss-team" style="font-size: 13px; font-weight: 500">How many technicians work here?</span>
<div role="group" aria-labelledby="ss-team" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="false" style="height: 48px; border: 1px solid #D9E0DB; border-radius: 12px; background: #FFFFFF; font: 500 14px Inter, system-ui, sans-serif; color: #14201A; cursor: pointer">Just me</button>
<button type="button" aria-pressed="true" style="height: 48px; border: 1.5px solid #1E8416; border-radius: 12px; background: #E9F6E7; font: 600 14px Inter, system-ui, sans-serif; color: #176611; cursor: pointer">2 to 3</button>
<button type="button" aria-pressed="false" style="height: 48px; border: 1px solid #D9E0DB; border-radius: 12px; background: #FFFFFF; font: 500 14px Inter, system-ui, sans-serif; color: #14201A; cursor: pointer">4 to 10</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span id="ss-lang" style="font-size: 13px; font-weight: 500">App language</span>
<div role="group" aria-labelledby="ss-lang" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="height: 48px; border: 1.5px solid #1E8416; border-radius: 12px; background: #E9F6E7; font: 600 14px Inter, system-ui, sans-serif; color: #176611; cursor: pointer">Kiswahili</button>
<button type="button" aria-pressed="false" style="height: 48px; border: 1px solid #D9E0DB; border-radius: 12px; background: #FFFFFF; font: 500 14px Inter, system-ui, sans-serif; color: #14201A; cursor: pointer">English</button>
</div>
</div>
