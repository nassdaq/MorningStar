[package]
name = "barua-talk"
description = "Barua Talk: rooms, chat, in-app calls and phone calls. Five screens reproduced from a design (the test of Morningstar's photographs beside its drawing) and seven of its own. With its server (server/) rooms, messages and calls are real, and a call carries sound, the two cameras and a shared screen through a live room (LiveKit, on Android); without it the app works end to end from the design's own people and messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The home-screen icon and name (ADR 0020). The picture is drawn by
# `cargo run -p barua-talk --example icon`.
#
# `services`: the app joins live rooms (ADR 0038), so its Android host is
# built with the LiveKit client; its calls have video (`live-video`: the
# camera permission) and can share the phone's screen (`live-screen`: the
# foreground services that needs), ADR 0039; and go on behind another app
# or a locked screen under a notification (`live-background`), ADR 0042.
# An app that does not name a service carries none of it.
[package.metadata.morningstar]
name = "Barua Talk"
icon = "assets/icon.png"
services = ["live", "live-video", "live-screen", "live-background"]

[lib]
# cdylib for Android; tools/build-ios.sh requests the static library itself.
crate-type = ["cdylib", "lib"]

[dependencies]
morningstar.workspace = true

[dev-dependencies]
morningstar-devtools.workspace = true
