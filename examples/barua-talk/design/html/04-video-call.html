<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0F15; color: #F4F5F8; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

<img src="../../assets/images/baraka-video.jpg" alt="Baraka on video" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; object-fit: cover; object-position: 30% 0">

<div style="position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(#0D0F15, rgba(13,15,21,0))"></div>

<div style="position: absolute; left: 20px; right: 20px; top: 56px; display: flex; align-items: center; gap: 10px">
<a href="Room.dc.html" aria-label="Back to chat" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<img src="../../assets/images/baraka.jpg" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #FFFFFF; box-sizing: border-box">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600">Baraka Mushi</span>
<span style="font-size: 13px; color: #F4F5F8; font-variant-numeric: tabular-nums">12:25</span>
</div>
<button aria-label="Add someone to the call" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(13,15,21,0.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20a6.5 6.5 0 0113 0M19 8v6M16 11h6"></path></svg>
</button>
</div>

<sc-if value="{{recording}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 20px; top: 124px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(13,15,21,0.7); font-size: 12px; color: #FFFFFF">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #FF5A72"></span>
Recording · TSh 30 / min
</div>
</sc-if>

<div style="position: absolute; right: 20px; top: 180px; width: 108px; height: 150px; border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,255,255,0.85); box-sizing: border-box">
<img src="../../assets/images/self-camera.jpg" alt="Your camera" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%">
</div>

<div style="position: absolute; left: 20px; top: 380px; width: 48px; padding: 14px 0; border-radius: 24px; background: rgba(13,15,21,0.55); display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 4px; height: 120px; border-radius: 2px; background: rgba(255,255,255,0.35); position: relative">
<div style="position: absolute; left: 0; bottom: 0; width: 4px; height: 76px; border-radius: 2px; background: #FFFFFF"></div>
<div style="position: absolute; left: -7px; bottom: 70px; width: 18px; height: 6px; border-radius: 3px; background: #FFFFFF"></div>
</div>
<svg role="img" aria-label="Speaker volume" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4zM16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"></path></svg>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 148px; background: #0D0F15; border-radius: 50% 50% 0 0 / 28px 28px 0 0; display: flex; align-items: center; justify-content: center; gap: 22px; padding-bottom: 16px; box-sizing: border-box">
<button aria-label="Turn camera off" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #2A2F3D; background: #171A24; color: #F4F5F8; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
</button>
<button aria-label="Share your screen" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #2A2F3D; background: #171A24; color: #F4F5F8; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M12 14V8M9 10.5L12 8l3 2.5M8 21h8"></path></svg>
</button>
<a href="Main.dc.html" aria-label="Hang up" style="width: 68px; height: 68px; border-radius: 50%; background: #D92D4B; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="28" height="28" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-2.6a9 9 0 00-6 0v2.6L5.5 17z"></path></svg>
</a>
<button aria-label="{{recLabel}}" sc-camel-on-click="{{toggleRec}}" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #2A2F3D; background: #171A24; color: #F4F5F8; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4" fill="{{recDot}}" stroke="none"></circle></svg>
</button>
<button aria-label="Mute microphone" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid #2A2F3D; background: #171A24; color: #F4F5F8; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"></path></svg>
</button>
</div>

</div>

<!-- the design tool's own script for this page (variables, state) -->
<script type="text/x-dc" data-dc-script="" data-props="{&quot;recordingOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
var base = this.props.recordingOn ?? true;
var rec = this.state && this.state.rec !== undefined ? this.state.rec : base;
var self = this;
return {
recording: rec,
recDot: rec ? '#FF5A72' : '#F4F5F8',
recLabel: rec ? 'Stop recording' : 'Start recording',
toggleRec: function () { self.setState({ rec: !rec }); }
};
}
}
</script>
