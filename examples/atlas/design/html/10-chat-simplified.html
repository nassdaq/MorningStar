<style>
body{margin:0}
a{color:#A0287A}a:hover{color:#7B3FD9}

</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF8FC; color: #1D1830; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 52px 20px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 4px; margin: 0 -10px">
<a href="HomeV2.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #1D1830">
<svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Compare supplier quotes</h1>
<a href="Models.dc.html" style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 10px; color: #5E5873; font-size: 13px; font-weight: 600; text-decoration: none">Auto
<svg aria-hidden="true" width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</a>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px">
<div style="align-self: flex-end; max-width: 290px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(29,24,48,0.10); font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="14" height="14" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A0287A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4"></path></svg>
3 PDFs</span>
<p style="margin: 0; padding: 12px 16px; border-radius: 20px 20px 6px 20px; background: rgba(160,40,122,0.09); font-size: 15px; line-height: 1.5">Compare the prices in these three quotes, find the cheapest option and write me a summary.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 16px; line-height: 1.6">On it. I’ll check the totals against each other before I write the summary.</p>

<div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid rgba(29,24,48,0.08)">
<button sc-camel-on-click="{{ toggle }}" aria-expanded="{{ open }}" style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: transparent; border: 0; color: #1D1830; font-family: inherit; text-align: left; cursor: pointer">
<span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 2.5px solid rgba(160,40,122,0.2); border-top-color: #A0287A"></span>
<span style="flex-grow: 1; font-size: 14px; font-weight: 600">Comparing totals</span>
<span style="font-size: 13px; color: #5E5873">Step 3 of 4</span>
<svg aria-hidden="true" width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="#5E5873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 14px 14px; border-top: 1px solid rgba(29,24,48,0.08)">
<div style="display: flex; align-items: center; gap: 12px; margin-top: 10px">
<svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A0287A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 14px; color: #5E5873">Read 3 documents</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A0287A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 14px; color: #5E5873">Extract line items and prices</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 2.5px solid rgba(160,40,122,0.2); border-top-color: #A0287A"></span>
<span style="font-size: 14px; font-weight: 700">Compare totals</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px dashed #8E88A3"></span>
<span style="font-size: 14px; color: #5E5873">Write summary</span>
</div>
<button style="align-self: flex-start; height: 44px; margin-top: 2px; padding: 0 18px; border-radius: 22px; background: transparent; border: 1px solid rgba(29,24,48,0.2); color: #1D1830; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Cancel task</button>
</div>
</sc-if>
</div>
</div>
</div>

<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(29,24,48,0.10); box-shadow: 0 8px 24px rgba(120,80,160,0.10)">
<button aria-label="Add a photo, file or camera shot" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(29,24,48,0.05); border: 0; color: #1D1830; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<input aria-label="Message Atlas" type="text" placeholder="Reply" sc-camel-on-change="{{ onType }}" style="flex-grow: 1; min-width: 0; height: 44px; background: transparent; border: 0; outline: 0; color: #1D1830; font-family: inherit; font-size: 16px; padding: 0 8px">
<sc-if value="{{ noText }}" hint-placeholder-val="{{ true }}">
<a href="Voice.dc.html" aria-label="Start voice conversation" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #1D1830">
<svg aria-hidden="true" width="21" height="21" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</a>
</sc-if>
<sc-if value="{{ hasText }}" hint-placeholder-val="{{ false }}">
<button aria-label="Send" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, #C2338F, #8B3FD9); border: 0; color: #FFFFFF; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</button>
</sc-if>
</div>
</div>

<!-- the design tool's own script for this page (variables, state) -->
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var self = this;
return {
open: !!s.open,
hasText: !!s.has,
noText: !s.has,
toggle: function () { self.setState({ open: !(self.state && self.state.open) }); },
onType: function (e) { self.setState({ has: e.target.value.length > 0 }); }
};
}
}
</script>
