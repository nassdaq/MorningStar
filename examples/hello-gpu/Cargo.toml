[package]
name = "hello-gpu"
description = "Proof of concept: one Rust source drawing and handling touch on Android and iOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib -> libhello_gpu.so for Android. The iOS static library is requested
# explicitly by tools/build-ios.sh (`cargo rustc --crate-type staticlib`), so
# host builds and tests do not produce a 250 MB archive nobody uses.
crate-type = ["cdylib", "lib"]

[dependencies]
morningstar.workspace = true

[dev-dependencies]
# For rendering the app offscreen in tests and the screenshot example.
morningstar-gpu.workspace = true
morningstar-devtools.workspace = true
